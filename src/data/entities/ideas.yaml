- id: ai-governance
  label: AI Governance
  type: concept
  aliases: [who decides]
  strands: []
  short: >-
    The question this story ends on: which institutions (labs, funders, states, courts, publics) get to decide what counts as "safe" or "secure" AI, and on whose behalf.
