# Concepts, works, events, funds — from docs/tescreal-article.md + research docx

# ---------- concepts ----------

- id: utilitarianism
  label: Utilitarianism
  type: concept
  strands: [EA]
  short: >-
    The maximizing ethic of Bentham and Mill — the greatest happiness for the greatest number — that EA operationalized.
  tags: [philosophy, ethics]
  status: published

- id: expected-utility
  label: Expected Utility
  type: concept
  strands: [EA]
  short: >-
    The decision rule underneath everything here: multiply welfare by probability, maximize the product, treat intuition as bias.
  tags: [decision-theory, ethics]
  status: published

- id: existential-risk
  label: Existential Risk
  type: concept
  aliases: [x-risk]
  strands: [L]
  short: >-
    Risks that could permanently destroy humanity's long-term potential — unaligned AI, engineered pandemics, nuclear war — longtermism's top priority.
  tags: [longtermism, risk]
  status: published

- id: ai-alignment
  label: AI Alignment
  type: concept
  strands: [R, L]
  short: >-
    The problem of making a highly capable AI system pursue the goals its builders intend; Yudkowsky's life project after 2001, now a field at every major lab.
  tags: [ai-safety]
  status: published

- id: ai-safety
  label: AI Safety
  type: concept
  strands: [L]
  short: >-
    In EA usage, narrowly the mitigation of hypothetical future existential risk — not today's concrete AI harms.
  tags: [ai, longtermism]
  status: published

- id: ai-ethics
  label: AI Ethics
  type: concept
  strands: []
  short: >-
    Work on present-day AI harms — bias, privacy, labor, environment — chronically underfunded next to longtermist safety research.
  tags: [ai, present-harms]
  status: published

- id: eugenics
  label: Eugenics
  type: concept
  strands: [T]
  short: >-
    The twentieth-century program of improving populations by coercion — sterilization, murder, selective breeding — whose logic haunts transhumanism's genealogy.
  tags: [history, genealogy]
  status: published

- id: replaceability
  label: Replaceability
  type: concept
  strands: [EA]
  short: >-
    The EA argument that your conventional-do-gooding seat will be filled by someone roughly as good, so take the lucrative job and donate.
  tags: [earning-to-give, ethics]
  status: published

- id: moral-offsetting
  label: Moral Offsetting
  type: concept
  strands: [EA]
  short: >-
    The doctrine that morally controversial careers are justified when donations offset the damage and then some; critics call it moral carbon offsetting.
  tags: [earning-to-give, ethics]
  status: published

- id: non-identity-problem
  label: Non-Identity Problem
  type: concept
  strands: [L]
  short: >-
    Parfit's puzzle about obligations to people whose very existence depends on our choices — the seed of longtermist duties to the future.
  tags: [philosophy, longtermism]
  status: published

- id: hinge-of-history
  label: Hinge of History
  type: concept
  strands: [L]
  short: >-
    The longtermist claim that the present moment disproportionately determines the far future — and therefore commands its resources.
  tags: [longtermism]
  status: published

- id: intelligence-explosion
  label: Intelligence Explosion
  type: concept
  strands: [S]
  short: >-
    Recursive self-improvement: AGI designs AGI+, which designs AGI++, reaching superintelligence in days or hours.
  tags: [singularity, agi]
  status: published

- id: astronomical-waste
  label: Astronomical Waste
  type: concept
  strands: [L]
  short: >-
    Bostrom's argument that every century of delay in settling the cosmos forfeits roughly 10^38 potential human lives, so reducing extinction risk outweighs speeding progress.
  tags: [longtermism]
  status: published
  sources: ["[primary] Bostrom, 'Astronomical Waste', Utilitas 15(3), 2003, pp. 308-314"]

- id: far-future-priority-objection
  label: Far-Future Priority Objection
  type: concept
  strands: [L]
  short: >-
    Hupfer's formalization of the crowding-out critique: longtermist budgets shrink today's emergencies in relative terms.
  tags: [critique, longtermism]
  status: published

- id: charter-cities
  label: Charter Cities
  type: concept
  strands: [L]
  short: >-
    MacAskill's proposal for autonomous law-laboratories of policy; in practice, critics note, a libertarian project with a crushed-experiment history.
  tags: [politics, longtermism]
  status: published

- id: nonprofit-industrial-complex
  label: Nonprofit Industrial Complex
  type: concept
  strands: []
  short: >-
    Critics' term for tax-deductible giving that papers over the inequities producing the wealth while its actors lobby against public services.
  tags: [critique, philanthropy]
  status: published

- id: ustopia
  label: Ustopia
  type: concept
  strands: []
  short: >-
    Benjamin's proposal, borrowing from Atwood: what we create together when wide awake — neither dream-utopia nor nightmare-dystopia.
  tags: [alternatives, democracy]
  status: published

- id: crisis-of-imagination
  label: Crisis of Imagination
  type: concept
  strands: []
  short: >-
    Hopkins's diagnosis: leaps of imagination built everything, yet a safer path forward stays unreachable while imagination is captured by manufactured demand.
  tags: [alternatives, imagination]
  status: published

- id: positive-sum-economics
  label: Positive-Sum Economics
  type: concept
  strands: []
  short: >-
    The Kurzgesagt–Roser case that growth turned the fixed pie growing, so everyone's prosperity is your self-interest — sharing TESCREAL's infinite-growth assumption.
  tags: [economics, growth]
  status: published

# ---------- works ----------

- id: famine-affluence-and-morality
  label: Famine, Affluence, and Morality
  type: work
  strands: [EA]
  short: >-
    Singer's 1972 paper whose drowning-child argument dynamited moral philosophy and seeded effective altruism forty years later.
  dates:
    start: "1972"
  tags: [paper, ethics]
  status: published

- id: astronomical-waste-2003
  label: Astronomical Waste
  type: work
  strands: [L]
  short: >-
    Bostrom's 2003 Utilitas paper pricing each century of delayed space settlement at about 10^38 lost lives (10^29 per second); the 10^58 digital-minds figure comes from his later work.
  dates:
    start: "2003"
  tags: [paper, longtermism]
  status: published
  sources: ["[primary] Utilitas 15(3), 2003; 10^58 appears in Bostrom 2013 / Superintelligence 2014, not here"]

- id: strong-longtermism-2021
  label: The Case for Strong Longtermism
  type: work
  strands: [L]
  short: >-
    Greaves and MacAskill's 2021 GPI paper: with at least 10^24 expected future beings, cutting extinction risk by a millionth of a percentage point is worth ten quadrillion (10^16) lives.
  dates:
    start: "2021"
  tags: [paper, longtermism]
  status: published
  sources: ["[primary] GPI Working Paper, June 2021, section 3"]

- id: beckstead-dissertation-2013
  label: On the Overwhelming Importance of Shaping the Far Future
  type: work
  strands: [L]
  short: >-
    Beckstead's 2013 Rutgers dissertation: shaping the far future matters overwhelmingly, which led him to find it "more plausible" that a rich-country life is worth more, other things being equal.
  dates:
    start: "2013"
  tags: [dissertation, longtermism]
  status: published
  sources: ["[primary] Beckstead, On the Overwhelming Importance of Shaping the Far Future (Rutgers, 2013), ch. 1"]

- id: stochastic-parrots
  label: On the Dangers of Stochastic Parrots
  type: work
  strands: []
  short: >-
    Bender, Gebru, McMillan-Major and Mitchell's FAccT 2021 paper on the costs and risks of large language models; the dispute over it ended Gebru's job at Google in December 2020.
  dates:
    start: "2021"
  tags: [paper, ai-ethics]
  status: published

- id: good-it-promises-harm-it-does
  label: The Good It Promises, the Harm It Does
  type: work
  strands: []
  short: >-
    The 2023 essay collection with Srinivasan's foreword — the strongest book-length critique of EA, and its epistemology of expected utility.
  dates:
    start: "2023"
  tags: [book, critique]
  status: published

- id: if-anyone-builds-it-everyone-dies
  label: If Anyone Builds It, Everyone Dies
  type: work
  strands: [R, L]
  short: >-
    Yudkowsky and Soares's September 2025 expansion of the doomer case: building superintelligence defaults to everyone dying.
  dates:
    start: "2025"
  tags: [book, doomerism]
  status: published

- id: techno-optimist-manifesto
  label: The Techno-Optimist Manifesto
  type: work
  strands: []
  short: >-
    Andreessen's 16 October 2023 manifesto: technology solves material problems, energy use should rise 1,000x, and 'existential risk' and 'tech ethics' are named among its enemies.
  dates:
    start: "2023"
  tags: [manifesto, accelerationism]
  status: published
  sources: ["[primary] a16z.com, 16 Oct 2023"]

- id: cosmist-manifesto
  label: Cosmist Manifesto
  type: work
  strands: [C]
  short: >-
    Ben Goertzel's 2010 manifesto for 'modern cosmism': space-time engineering and 'future magic' will deliver by science what religions promised, including resurrecting the dead.
  dates:
    start: "2010"
  tags: [manifesto, cosmism]
  status: published
  sources: ["Goertzel (2010) — verify quote (backlog B12)"]

- id: ai-2027
  label: AI 2027
  type: work
  strands: [S]
  short: >-
    The 2025 scenario by Daniel Kokotajlo, Scott Alexander and colleagues: superhuman AI researchers by 2027, and two endings, a race to catastrophe or a slowdown.
  dates:
    start: "2025"
  tags: [scenario, singularity]
  status: published
  sources: ["[primary] ai-2027.com (April 2025)"]

- id: sequences
  label: Sequences
  type: work
  strands: [R]
  short: >-
    Yudkowsky's 2006–09 LessWrong essays on bias and decision-making, the rationalist on-ramp alongside the fanfiction.
  dates:
    start: "2006"
    end: "2009"
  tags: [essays, rationalism]
  status: published

- id: hpmor
  label: Harry Potter and the Methods of Rationality
  type: work
  strands: [R]
  short: >-
    Yudkowsky's 2010–15 fanfiction that onboarded a quarter of LessWrong's users, per a 2013 survey.
  dates:
    start: "2010"
    end: "2015"
  tags: [fiction, rationalism]
  status: published

- id: torture-vs-dust-specks
  label: Torture vs. Dust Specks
  type: work
  strands: [R]
  short: >-
    Yudkowsky's 2007 LessWrong post: is one person tortured for fifty years worse than 3^^^3 people each getting a dust speck in the eye? He answers that the specks are worse.
  dates:
    start: "2007"
  tags: [essay, utilitarianism]
  status: published
  sources: ["[primary] LessWrong, 30 October 2007"]

- id: selfish-argument-kurzgesagt
  label: A Selfish Argument for Making the World a Better Place
  type: work
  strands: []
  short: >-
    Kurzgesagt's 2018 explainer on 'egoistic altruism': in a positive-sum world, lifting billions out of poverty multiplies the inventors and customers who will cure what kills you.
  dates:
    start: "2018"
  tags: [video, growth]
  status: published

# ---------- events ----------

- id: ftx-collapse
  label: FTX Collapse
  type: event
  strands: [EA]
  short: >-
    Eleven days in November 2022 — CoinDesk leak, CZ's FTT sale, Binance walking away, bankruptcy — vaporizing about $8 billion in customer funds.
  dates:
    start: "2022-11-02"
    end: "2022-11-11"
  tags: [crypto, fraud]
  status: published

- id: openai-board-crisis
  label: OpenAI Board Crisis
  type: event
  strands: [L]
  short: >-
    Five days in November 2023: the nonprofit board fired Altman, 745 of 770 employees revolted, and the EA-linked board lost.
  dates:
    start: "2023-11-17"
    end: "2023-11-22"
  tags: [governance, ai]
  status: published

- id: singularity-summit
  label: Singularity Summit
  type: event
  strands: [R]
  short: >-
    Annual futurist conference (2006–2012) run by the Singularity Institute with Thiel's backing; at the 2010 edition DeepMind's founders got the meeting that led to Thiel's investment.
  dates:
    start: "2006"
    end: "2012"
  tags: [summit, ai]
  status: published

# ---------- funds ----------

- id: ftx-future-fund
  label: FTX Future Fund
  type: fund
  strands: [EA, L]
  short: >-
    The FTX Foundation's grant vehicle, announced 28 February 2022 (Beckstead CEO, MacAskill advising), which committed about $160M to longtermist causes before its team resigned on 10 November 2022.
  dates:
    start: "2022-02-28"
    end: "2022-11-10"
  tags: [grants, ftx]
  status: published
  sources: ["[primary] 'Announcing the Future Fund', EA Forum, 28 Feb 2022", "[primary] 'The FTX Future Fund team has resigned', EA Forum, 10 Nov 2022"]

