# ---------- concepts: the philosophy underneath ----------

- id: impartiality
  label: Impartiality
  type: concept
  strands: [EA]
  short: >-
    The principle that a person's suffering counts the same whether they are your child, a stranger abroad, or someone not yet born. Singer's pond made it vivid; longtermism extends it across time.
  tags: [ethics, foundations]
  status: published

- id: welfarism
  label: Welfarism
  type: concept
  strands: [EA]
  short: >-
    The view that only well-being matters morally. MacAskill calls EA "tentatively welfarist": about promoting well-being, not protecting biodiversity or natural beauty for their own sakes.
  tags: [ethics, foundations]
  status: published
  sources: ["[primary] MacAskill, 'The Definition of Effective Altruism' (2019)"]

- id: itn-framework
  label: Importance, Tractability, Neglectedness
  type: concept
  aliases: [ITN framework]
  strands: [EA]
  short: >-
    EA's triage rule for choosing causes: how big is the problem, how solvable, how ignored? It is why 80,000 Hours ranks AI risk first and climate among "other pressing problems".
  tags: [method, prioritization]
  status: published
  sources: ["[primary] 80000hours.org problem-profiles methodology"]

- id: wild-animal-suffering
  label: Wild Animal Suffering
  type: concept
  strands: [EA]
  short: >-
    The welfarist worry that most wild animals' lives contain more suffering than joy, which pushes some EAs toward the unsettling conclusion that shrinking wild habitat could be net positive.
  tags: [ethics, nature]
  status: published

- id: repugnant-conclusion
  label: Repugnant Conclusion
  type: concept
  strands: [L]
  short: >-
    Parfit's discovery that plausible steps imply a vast population of lives barely worth living is better than a smaller flourishing one. Longtermist population ethics has lived next to it ever since.
  dates:
    start: "1984"
  tags: [philosophy, population-ethics]
  status: published
  sources: ["[primary] Parfit, Reasons and Persons (1984), Part IV"]

- id: value-lock-in
  label: Value Lock-in
  type: concept
  strands: [L]
  short: >-
    MacAskill's warning that some set of values, possibly carried by AGI or a world government, could become permanently entrenched, freezing moral progress for millennia.
  tags: [longtermism, ai]
  status: published
  sources: ["[primary] MacAskill, What We Owe the Future (2022)"]

- id: existential-security
  label: Existential Security
  type: concept
  strands: [L]
  short: >-
    Ord's name for the goal beyond the Precipice: a state in which extinction risk has been driven low and kept low, buying time for a Long Reflection.
  tags: [longtermism, risk]
  status: published
  sources: ["[primary] Ord, The Precipice (2020)"]

- id: long-reflection
  label: The Long Reflection
  type: concept
  strands: [L]
  short: >-
    Ord and MacAskill's proposal that, once safe, humanity should spend a long period deliberating what it values before making irreversible choices about its cosmic future.
  tags: [longtermism]
  status: published
  sources: ["[primary] Ord, The Precipice (2020)"]

- id: fanaticism
  label: Fanaticism (Pascal's Mugging)
  type: concept
  aliases: [Pascal's mugging]
  strands: []
  short: >-
    The objection that expected-value reasoning lets tiny probabilities of astronomical payoffs override everything else, so a stranger promising 10^50 lives can "mug" you out of your wallet.
  tags: [decision-theory, critique]
  status: published
  sources: ["[primary] Bostrom, 'Pascal's Mugging', Analysis 69(3), 2009"]

- id: ends-justify-means
  label: Ends Justify the Means
  type: concept
  strands: []
  short: >-
    The worry that a morality which only counts outcomes will license any present wrong, fraud included, if the projected future benefit is large enough.
  tags: [ethics, critique]
  status: published

- id: posthuman
  label: Posthuman
  type: concept
  strands: [T]
  short: >-
    A being whose capacities in healthspan, cognition or emotion so far exceed ours that it is no longer human in the ordinary sense; transhumanism's destination.
  tags: [transhumanism]
  status: published

- id: liberal-eugenics
  label: Liberal Eugenics
  type: concept
  aliases: [germinal choice]
  strands: [T]
  short: >-
    The claim that enhancement chosen freely by parents and individuals, not imposed by states, escapes the crimes of twentieth-century eugenics. Critics ask whether markets and inequality recreate the coercion.
  tags: [transhumanism, eugenics]
  status: published

- id: instrumental-convergence
  label: Instrumental Convergence
  type: concept
  strands: [R, L]
  short: >-
    Bostrom's thesis that almost any goal gives an AI reasons to acquire resources, resist shutdown and preserve itself, so danger does not require malice.
  tags: [ai-safety]
  status: published
  sources: ["[primary] Bostrom, Superintelligence (2014), ch. 7"]

- id: doomerism
  label: AI Doomerism
  type: concept
  strands: [R]
  short: >-
    The view, most associated with Yudkowsky and MIRI, that building superintelligence under current conditions will by default kill everyone, so development must be halted.
  tags: [ai-safety]
  status: published

- id: ai-race
  label: The AGI Race
  type: concept
  strands: []
  short: >-
    The competition among labs and states to build artificial general intelligence first, justified on every side by the same argument: if we do not build it, someone less careful will.
  tags: [ai, geopolitics]
  status: published

- id: ai-succession
  label: AI Succession
  type: concept
  strands: [S, T]
  short: >-
    The view that humanity's role is to give rise to successor minds that may replace us, voiced by Richard Sutton and, in Musk's phrase, humans as a "biological bootloader" for digital superintelligence.
  tags: [singularity, ai]
  status: published

- id: d-acc
  label: d/acc
  type: concept
  aliases: [defensive accelerationism]
  strands: []
  short: >-
    Vitalik Buterin's 2023 middle path between e/acc and doomerism: accelerate, but favor defensive, decentralized and democratic technologies.
  dates:
    start: "2023"
  tags: [accelerationism, alternatives]
  status: published
  sources: ["[primary] Buterin, 'My techno-optimism', vitalik.eth.limo, Nov 2023"]

- id: techno-millenarianism
  label: Techno-Millenarianism
  type: concept
  aliases: [religion of technology]
  strands: []
  short: >-
    The scholarly argument that technological futurism recycles religious structure: a fallen present, a coming rupture (the Singularity), salvation (upload, alignment) and a priesthood.
  tags: [religion, analysis]
  status: published
  sources: ["[primary] Noble, The Religion of Technology (1997); Geraci, Apocalyptic AI (2010)"]

- id: utopia-apocalypse-binary
  label: Utopia/Apocalypse Binary
  type: concept
  strands: []
  short: >-
    The critics' observation that AI debate swings between paradise and extinction, two stories in which technology acts on us and the question of who is harmed now never gets asked.
  tags: [critique, alternatives]
  status: published

