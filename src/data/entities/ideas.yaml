  status: published

- id: industry-self-governance
  label: Industry Self-Governance
  type: concept
  strands: []
  short: >-
    Labs writing their own rules: nonprofit boards, benefit trusts, scaling policies, voluntary summit commitments. Strong on paper; tested by money, rivals and governments.
  tags: [governance, labs]
  status: published

- id: ai-security
  label: AI Security
  type: concept
  strands: []
  short: >-
