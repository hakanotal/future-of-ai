# ---------- events ----------

- id: ftx-collapse
  label: FTX Collapse
  type: event
  strands: [EA]
  short: >-
    Eleven days in November 2022 — CoinDesk leak, CZ's FTT sale, Binance walking away, bankruptcy — vaporizing about $8 billion in customer funds.
  dates:
    start: "2022-11-02"
    end: "2022-11-11"
  tags: [crypto, fraud]
  status: published

- id: openai-board-crisis
  label: OpenAI Board Crisis
  type: event
  strands: [L]
  short: >-
    Five days in November 2023: the nonprofit board fired Altman, 745 of 770 employees revolted, and the EA-linked board lost.
  dates:
    start: "2023-11-17"
    end: "2023-11-22"
  tags: [governance, ai]
  status: published

- id: singularity-summit
  label: Singularity Summit
  type: event
  strands: [R]
  short: >-
    The Thiel-funded Stanford summit that networked Yudkowsky's circle into existence — and, most consequentially, seeded DeepMind.
  tags: [summit, ai]
  status: published

