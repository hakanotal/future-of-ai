# TESCREAL Wiki - Seed Entities
# Based on the article "The Hidden Faith of Silicon Valley"

- id: tescreal
  label: TESCREAL
  type: concept
  strands: [T, E, S, C, R, EA, L]
  short: >-
    An acronym for seven interconnected ideologies: Transhumanism, Extropianism, Singularitarianism, Cosmism, Rationalism, Effective Altruism, and Longtermism.
  dates:
    start: "2023"
  tags: [ideology, bundle, silicon-valley]
  status: published

- id: peter-singer
  label: Peter Singer
  type: person
  strands: [EA]
  short: >-
    Australian philosopher whose 1972 paper "Famine, Affluence, and Morality" proposed the drowning child argument that became foundational to effective altruism.
  dates:
    start: "1946"
  located_in: Princeton
  tags: [philosopher, ethics, effective-altruism]
  status: published

- id: toby-ord
  label: Toby Ord
  type: person
  strands: [EA, L]
  short: >-
    Australian philosopher who co-founded Giving What We Can in 2009 and authored "The Precipice" (2020), estimating a 1-in-6 chance of existential catastrophe this century.
  dates:
    start: "1979"
  located_in: Oxford
  tags: [philosopher, effective-altruism, longtermism]
  status: published

- id: william-macaskill
  label: William MacAskill
  type: person
  strands: [EA, L]
  short: >-
    Scottish philosopher who co-founded 80,000 Hours and the Centre for Effective Altruism, and authored "What We Owe the Future" (2022), a key text of longtermism.
  dates:
    start: "1987"
  located_in: Oxford
  tags: [philosopher, effective-altruism, longtermism]
  status: published

- id: sam-bankman-fried
  label: Sam Bankman-Fried
  type: person
  strands: [EA, L]
  short: >-
    Founder of Alameda Research and FTX, once a poster child of effective altruism's "earning to give" strategy, later convicted of fraud.
  dates:
    start: "1992"
  tags: [finance, crypto, fraud, effective-altruism]
  status: published

- id: nick-bostrom
  label: Nick Bostrom
  type: person
  strands: [T, L]
  short: >-
    Swedish philosopher who founded Oxford's Future of Humanity Institute and authored "Superintelligence" (2014), popularizing concerns about AI existential risk.
  dates:
    start: "1973"
  located_in: Oxford
  tags: [philosopher, existential-risk, transhumanism]
  status: published

- id: eliezer-yudkowsky
  label: Eliezer Yudkowsky
  type: person
  strands: [R, L]
  short: >-
    AI researcher who founded the Machine Intelligence Research Institute and LessWrong, becoming a central figure in AI alignment and rationalist thought.
  dates:
    start: "1979"
  tags: [ai-safety, rationalism, alignment]
  status: published

- id: timnit-gebru
  label: Timnit Gebru
  type: person
  strands: [R]
  short: >-
    Computer scientist who co-authored "On the Dangers of Stochastic Parrots" and founded the Distributed AI Research Institute (DAIR), coining the term TESCREAL.
  dates:
    start: "1983"
  tags: [ai-ethics, researcher, critic]
  status: published

- id: emile-torres
  label: Émile P. Torres
  type: person
  strands: [R]
  short: >-
    Philosopher and former transhumanist who co-authored the TESCREAL paper with Gebru, offering a critical analysis of Silicon Valley's ideological foundations.
  tags: [philosopher, critic, transhumanism]
  status: published

- id: julian-huxley
  label: Julian Huxley
  type: person
  strands: [T]
  short: >-
    British biologist who popularized the term "transhumanism" in 1957 and served as president of the British Eugenics Society.
  dates:
    start: "1887"
    end: "1975"
  tags: [biologist, transhumanism, eugenics]
  status: published

- id: derek-parfit
  label: Derek Parfit
  type: person
  strands: [L]
  short: >-
    Oxford philosopher whose "Reasons and Persons" (1984) argued for moral obligations to future people, seeding longtermist philosophy.
  dates:
    start: "1942"
    end: "2017"
  located_in: Oxford
  tags: [philosopher, ethics, longtermism]
  status: published

